<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Nova List - Organiza tus tareas, listas y pendientes."
    >

    <title>Nova List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            background: #ffffff;
            color: #111111;

            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 20px 100px;
        }

        /* HEADER */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 35px;
        }

        .menu-button {
            width: 42px;
            height: 42px;

            border: 1px solid #111;
            border-radius: 50%;

            background: white;
            color: #111;

            font-size: 20px;

            cursor: pointer;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header-space {
            width: 42px;
        }

        /* GREETING */

        .greeting {
            margin-bottom: 28px;
        }

        .greeting small {
            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 6px;
        }

        .greeting h1 {
            font-size: 32px;
            line-height: 1.1;
        }

        /* QUICK ADD */

        .quick-add {
            display: flex;

            border: 1px solid #d8d8d8;
            border-radius: 14px;

            overflow: hidden;

            margin-bottom: 30px;
        }

        .quick-add input {
            flex: 1;

            border: none;
            outline: none;

            padding: 16px;

            font-size: 15px;
        }

        .quick-add button {
            width: 55px;

            border: none;

            background: #111;
            color: white;

            font-size: 24px;

            cursor: pointer;
        }

        /* STATS */

        .stats {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 35px;
        }

        .stat {
            border: 1px solid #e1e1e1;

            border-radius: 14px;

            padding: 15px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #777;
        }

        /* SECTION */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 14px;
        }

        .section-header h2 {
            font-size: 18px;
        }

        .section-header span {
            font-size: 12px;
            color: #777;
        }

        /* TASKS */

        .tasks {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 15px;

            border: 1px solid #e1e1e1;
            border-radius: 14px;
        }

        .task-check {
            width: 22px;
            height: 22px;

            border: 1px solid #111;
            border-radius: 50%;

            background: white;

            flex-shrink: 0;

            cursor: pointer;
        }

        .task.completed .task-check {
            background: #111;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 15px;

            word-break: break-word;
        }

        .task.completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-delete {
            border: none;
            background: none;

            color: #999;

            font-size: 18px;

            cursor: pointer;
        }

        .empty {
            text-align: center;

            padding: 35px 20px;

            color: #888;

            font-size: 14px;

            border: 1px dashed #ddd;
            border-radius: 14px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .app {
                padding: 20px 16px 90px;
            }

            .greeting h1 {
                font-size: 28px;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 12px;
            }

            .stat-number {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header>

            <button
                class="menu-button"
                aria-label="Abrir menú"
                onclick="openMenu()"
            >
                ⋯
            </button>

            <div class="logo">
                NOVA LIST
            </div>

            <div class="header-space"></div>

        </header>

        <section class="greeting">

            <small id="currentDate"></small>

            <h1>
                Mis pendientes
            </h1>

        </section>

        <div class="quick-add">

            <input
                id="taskInput"
                type="text"
                placeholder="¿Qué necesitas hacer?"
                autocomplete="off"
            >

            <button
                onclick="addTask()"
                aria-label="Agregar tarea"
            >
                +
            </button>

        </div>

        <section class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="totalTasks"
                >
                    0
                </div>

                <div class="stat-label">
                    Pendientes
                </div>

            </div>

            <div class="stat">

                <div
                    class="stat-number"
                    id="completedTasks"
                >
                    0
                </div>

                <div class="stat-label">
                    Completadas
                </div>

            </div>

            <div class="stat">

                <div
                    class="stat-number"
                    id="remainingTasks"
                >
                    0
                </div>

                <div class="stat-label">
                    Restantes
                </div>

            </div>

        </section>

        <section>

            <div class="section-header">

                <h2>
                    Mis tareas
                </h2>

                <span id="taskCount">
                    0 tareas
                </span>

            </div>

            <div
                class="tasks"
                id="taskList"
            ></div>

        </section>

    </div>

    <script>

        /* --------------------------------
           DATOS
        -------------------------------- */

        let tasks = JSON.parse(
            localStorage.getItem("novaListTasks")
        ) || [];


        /* --------------------------------
           FECHA
        -------------------------------- */

        function showDate() {

            const date = new Date();

            const options = {
                weekday: "long",
                day: "numeric",
                month: "long"
            };

            document.getElementById("currentDate").textContent =
                date.toLocaleDateString("es-ES", options);
        }


        /* --------------------------------
           GUARDAR
        -------------------------------- */

        function saveTasks() {

            localStorage.setItem(
                "novaListTasks",
                JSON.stringify(tasks)
            );

        }


        /* --------------------------------
           AGREGAR TAREA
        -------------------------------- */

        function addTask() {

            const input =
                document.getElementById("taskInput");

            const title =
                input.value.trim();

            if (!title) {
                return;
            }

            const task = {

                id: Date.now(),

                title: title,

                completed: false

            };

            tasks.unshift(task);

            saveTasks();

            input.value = "";

            renderTasks();

        }


        /* --------------------------------
           COMPLETAR TAREA
        -------------------------------- */

        function toggleTask(id) {

            tasks = tasks.map(task => {

                if (task.id === id) {

                    return {
                        ...task,
                        completed: !task.completed
                    };

                }

                return task;

            });

            saveTasks();

            renderTasks();

        }


        /* --------------------------------
           ELIMINAR TAREA
        -------------------------------- */

        function deleteTask(id) {

            tasks = tasks.filter(
                task => task.id !== id
            );

            saveTasks();

            renderTasks();

        }


        /* --------------------------------
           MOSTRAR TAREAS
        -------------------------------- */

        function renderTasks() {

            const container =
                document.getElementById("taskList");

            if (tasks.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No tienes pendientes todavía.
                    </div>
                `;

            } else {

                container.innerHTML = tasks.map(task => `

                    <div
                        class="task ${
                            task.completed ? "completed" : ""
                        }"
                    >

                        <button
                            class="task-check"
                            onclick="toggleTask(${task.id})"
                            aria-label="Completar tarea"
                        ></button>

                        <div class="task-content">

                            <div class="task-title">
                                ${escapeHTML(task.title)}
                            </div>

                        </div>

                        <button
                            class="task-delete"
                            onclick="deleteTask(${task.id})"
                            aria-label="Eliminar tarea"
                        >
                            ×
                        </button>

                    </div>

                `).join("");

            }

            updateStats();

        }


        /* --------------------------------
           ESTADÍSTICAS
        -------------------------------- */

        function updateStats() {

            const total = tasks.length;

            const completed =
                tasks.filter(task => task.completed).length;

            const remaining =
                total - completed;

            document.getElementById("totalTasks")
                .textContent = total;

            document.getElementById("completedTasks")
                .textContent = completed;

            document.getElementById("remainingTasks")
                .textContent = remaining;

            document.getElementById("taskCount")
                .textContent =
                `${total} ${total === 1 ? "tarea" : "tareas"}`;

        }


        /* --------------------------------
           SEGURIDAD BÁSICA
        -------------------------------- */

        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* --------------------------------
           MENÚ
        -------------------------------- */

        function openMenu() {

            alert(
                "El menú de Nova List lo construiremos en la siguiente etapa."
            );

        }


        /* --------------------------------
           ENTER PARA AGREGAR
        -------------------------------- */

        document
            .getElementById("taskInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            });


        /* --------------------------------
           INICIAR APP
        -------------------------------- */

        showDate();

        renderTasks();

    </script>

</body>
</html>
